# Binance API Configuration
# Note: api_key and api_secret will be automatically overridden by environment variables in .env file
# Recommended to use .env file for sensitive information configuration
binance:
  api_key: "BINANCE_API_KEY"        # Will be overridden by environment variable BINANCE_API_KEY
  api_secret: "BINANCE_API_SECRET"  # Will be overridden by environment variable BINANCE_API_SECRET
  testnet: true  # Testnet mode, change to false before live trading
  
# DeepSeek API Configuration (backward compatibility)
# Note: api_key will be automatically overridden by environment variables in .env file
deepseek:
  api_key: "DEEPSEEK_API_KEY"       # Will be overridden by environment variable DEEPSEEK_API_KEY
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  temperature: 0.3
  max_tokens: 2000

# LLM Configuration (multi-provider support)
# Supports: openai, deepseek, claude, qwen, gemini, kimi, minimax, glm
llm:
  provider: deepseek              # Currently used provider
  model: deepseek-chat            # Model name (leave empty to use provider default)
  temperature: 0.3
  max_tokens: 2000
  timeout: 120
  max_retries: 3

# Trading Configuration
trading:
  symbols: ["BTCUSDT"]  # Default uses only BTC, can add other symbols like "ETHUSDT", "SOLUSDT"
  primary_symbol: "BTCUSDT"  # Primary trading pair (backward compatibility)
  timeframes: ["1m", "5m", "15m", "1h"]
  leverage: 5
  symbol_blacklist: []  # Optional: Disable high-risk/low-liquidity symbols
  selector_min_quote_volume: 5000000  # 24h USDT trading volume lower limit
  selector_min_price: 0.05  # Filter ultra-low price symbols
  selector_min_quote_volume_per_usdt: 3000  # Dynamic trading volume lower limit (per 1 USDT equity)
  
# Risk Configuration
risk:
  max_risk_per_trade_pct: 1.5  # Maximum risk per trade
  max_total_position_pct: 33.3  # Maximum total position
  max_leverage: 5
  max_consecutive_losses: 3
  stop_trading_on_drawdown_pct: 10.0
  max_holding_cycles: 180  # Maximum holding period hard limit (≈ 9h if cycle_interval=3m)

# Redis Configuration
redis:
  host: "localhost"
  port: 6379
  db: 0
  
# Logging Configuration
logging:
  level: "INFO"
  file: "logs/trading.log"
  
# Backtest Configuration
backtest:
  start_date: "2024-01-01"
  end_date: "2024-12-01"
  initial_capital: 10000

# Agent Configuration (Optional Agent switches)
# Core agents (DataSyncAgent, QuantAnalystAgent, RiskAuditAgent) are always enabled
agents:
  # ML/AI Prediction Layer
  predict_agent: true              # ML probability prediction
  ai_prediction_filter_agent: true # AI veto mechanism (depends on predict_agent)
  
  # Market Analysis
  regime_detector_agent: true      # Market state detection (trending/oscillating/high volatility)
  position_analyzer_agent: false   # Price position analysis (range position)
  
  # Trigger Detection
  trigger_detector_agent: true     # 5m K-line pattern detection
  
  # LLM Semantic Analysis (consumes API quota, default off)
  trend_agent_llm: false           # 1h trend LLM analysis
  setup_agent_llm: false           # 15m entry LLM analysis
  trigger_agent_llm: false         # 5m trigger LLM analysis
  
  # Local Semantic Analysis (does not call LLM)
  trend_agent_local: true          # 1h trend rule analysis
  setup_agent_local: true          # 15m entry rule analysis
  trigger_agent_local: true        # 5m trigger rule analysis
  
  # Trade Reflection
  reflection_agent_llm: false      # LLM reflection after every 10 trades
  reflection_agent_local: true     # Local rule reflection
  
  # Symbol Selection
  symbol_selector_agent: true      # AUTO1/AUTO3 automatic symbol selection
