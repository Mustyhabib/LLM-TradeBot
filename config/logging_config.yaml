# Logging configuration file - Simplified
# Only key information, removing redundant logs

logging:
  # Main log level
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  
  # File logging
  file:
    enabled: true
    path: "logs/trading.log"
    rotation: "100 MB"
    retention: "7 days"
  
  # Console output configuration
  console:
    enabled: true
    simplified: true  # Simplified mode: only show key information
    
  # Per-module log levels (can be controlled individually)
  modules:
    # Core modules - keep at INFO
    trading: "INFO"
    decision: "INFO"
    risk: "INFO"
    execution: "INFO"
    
    # Data modules - reduce to WARNING (reduce output)
    data_fetch: "WARNING"
    data_process: "WARNING"
    data_saver: "WARNING"  # Key: reduce data save logs
    
    # Technical indicators - reduce to WARNING
    indicators: "WARNING"
    features: "WARNING"
    
    # API calls - reduce to WARNING
    binance_api: "WARNING"
    
  # Specific logs to mute (completely hidden)
  mute:
    - "Saving JSON"
    - "Saving CSV" 
    - "Saving Parquet"
    - "Step 1 data saved"
    - "Step 2 data saved"
    - "Step 3 data saved"
    - "Feature engineering complete"
    - "Starting feature engineering"
    - "Warm-up marker"
    - "Starting validation"
    - "Data validation passed"
    - "Snapshot generation"
    - "Processing candle"
