# =====================================
# Multi-Timeframe Data Alignment Configuration
# =====================================
# Controls the realtime vs. stable data strategy for different timeframes
# 
# Reference: DATA_FLOW_STRUCTURED.md - Multi-Timeframe Data Alignment and Realtime Issues

# Global mode selection
mode: 'backtest'  # Options: 'backtest' | 'live_safe' | 'live_aggressive'

# Mode description:
# - backtest:        All timeframes use iloc[-2] (completed candles), ensuring backtest consistency
# - live_safe:       Short timeframes use iloc[-1] (realtime), long timeframes use iloc[-2] (stable)
# - live_aggressive: All timeframes use iloc[-1] (realtime), pursuing minimum lag

# =====================================
# Mode Detailed Configuration
# =====================================

backtest:
  description: "Backtest mode - All timeframes use completed candles"
  timeframes:
    5m:
      use_realtime: false  # Uses iloc[-2]
      max_lag_minutes: 10
    15m:
      use_realtime: false
      max_lag_minutes: 40
    1h:
      use_realtime: false
      max_lag_minutes: 145  # 2h 25min

live_safe:
  description: "Live safe mode - Short timeframes realtime, long timeframes stable"
  timeframes:
    5m:
      use_realtime: true   # Uses iloc[-1]
      max_lag_minutes: 5
    15m:
      use_realtime: true
      max_lag_minutes: 15
    1h:
      use_realtime: false  # Long timeframe stays stable
      max_lag_minutes: 145

live_aggressive:
  description: "Live aggressive mode - All timeframes use realtime data"
  timeframes:
    5m:
      use_realtime: true
      max_lag_minutes: 5
    15m:
      use_realtime: true
      max_lag_minutes: 15
    1h:
      use_realtime: true   # Accepts repaint risk
      max_lag_minutes: 60

# =====================================
# Data Timestamp Validation
# =====================================

timestamp_validation:
  enabled: true
  
  # Check if data timestamps are within a reasonable range
  max_allowed_lag:
    5m: 15    # 5m data can lag at most 15 minutes (allows some network delay)
    15m: 45   # 15m data can lag at most 45 minutes
    1h: 150   # 1h data can lag at most 2.5 hours
  
  # Whether to warn when data lag exceeds threshold
  warn_on_excessive_lag: true
  
  # Whether to reject usage when data lag exceeds threshold
  reject_on_excessive_lag: false

# =====================================
# Repaint Risk Management
# =====================================

repaint_protection:
  enabled: true
  
  # Detect indicator changes at candle close
  track_indicator_changes: true
  
  # Warn when indicator changes exceed threshold
  warn_on_significant_change:
    rsi: 5.0      # RSI change exceeds 5
    macd: 10.0    # MACD change exceeds 10%
    price: 0.5    # Price change exceeds 0.5%
  
  # Whether to re-validate signals at candle close
  revalidate_on_close: true

# =====================================
# Logging Configuration
# =====================================

logging:
  # Whether to output data timestamps in logs
  log_data_timestamps: true
  
  # Whether to output lag time in logs
  log_lag_minutes: true
  
  # Whether to flag data as realtime in logs
  log_realtime_flag: true
  
  # Example log format:
  # [5m] price=96000 rsi=45.2 timestamp=2024-12-19T10:15:00 lag=10min realtime=false
  # [1h] price=95800 rsi=52.8 timestamp=2024-12-19T08:00:00 lag=145min realtime=false

# =====================================
# Performance Optimization
# =====================================

performance:
  # Whether to cache indicators for completed candles
  cache_completed_candles: true
  
  # Cache expiration time (seconds)
  cache_ttl_seconds: 300  # 5 minutes
  
  # Whether to process multi-timeframe data in parallel
  parallel_processing: true

# =====================================
# Experimental Features
# =====================================

experimental:
  # Whether to use weighted time alignment (adjust weight based on lag)
  time_weighted_alignment:
    enabled: false
    weights:
      5m: 1.0    # 10min lag, weight 1.0
      15m: 0.8   # 40min lag, weight reduced to 0.8
      1h: 0.5    # 145min lag, weight reduced to 0.5
  
  # Whether to use extrapolation to estimate current candle (based on historical volatility)
  current_candle_estimation:
    enabled: false
    method: 'exponential_smoothing'  # 'linear' | 'exponential_smoothing'
    confidence_threshold: 0.7

# =====================================
# Usage Instructions
# =====================================
# 
# 1. Modify global mode to quickly switch modes
# 2. Or directly modify specific timeframe's use_realtime setting
# 3. Enable timestamp_validation to monitor data quality
# 4. Enable repaint_protection to detect repaint risks
# 
# Recommended configuration:
# - Backtest/verification: mode = 'backtest'
# - Conservative live: mode = 'live_safe'
# - Aggressive live: mode = 'live_aggressive' + repaint_protection.enabled = true
